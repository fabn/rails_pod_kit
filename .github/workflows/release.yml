name: Release

on:
  release:
    types: [published]

jobs:
  push:
    name: Push to RubyGems
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the VERSION file
        # `rake release` builds from VERSION, not from the tag. When the two
        # disagree it builds the wrong version, finds no tag for it, and tries
        # to create and push one from this detached-HEAD checkout — which fails
        # after the build but before the gem is ever pushed, so the release
        # looks published while RubyGems never got anything. Fail here instead,
        # where the message says what to fix.
        run: |
          version="$(cat VERSION)"
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Release tag $tag does not match VERSION ($version)."
            echo "Point the tag at a commit whose VERSION file reads ${tag#v}, then re-run."
            exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: rubygems/release-gem@v1
        with:
          # Run our own propagation poll below so we can exclude the "full
          # index" awaiter (see next step).
          await-release: false
      - name: Wait for release to propagate
        # rubygems.org regenerates its legacy "full index" with a long delay,
        # so the default poll times out (~290s) and fails the job even though
        # the gem is already published. Skip only that awaiter; the compact
        # index checks (versions/info/gems/gemspecs/names) still gate the step.
        run: gem exec rubygems-await --skip "full index" pkg/*.gem
